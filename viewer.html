<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyberwave Catalog — Robot Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0d14;color:#e2e8f0;font-family:system-ui,sans-serif;display:flex;height:100vh;overflow:hidden}

#sidebar{width:260px;min-width:260px;background:#111827;border-right:1px solid #1f2937;display:flex;flex-direction:column}
#sidebar-header{padding:14px 16px 10px;border-bottom:1px solid #1f2937}
#sidebar-header h1{font-size:14px;font-weight:700;color:#7c3aed;letter-spacing:.03em}
#sidebar-header p{font-size:11px;color:#6b7280;margin-top:2px}
#search{margin:10px 12px;padding:7px 10px;background:#0d1117;border:1px solid #374151;border-radius:6px;color:#e2e8f0;font-size:12px;outline:none;width:calc(100% - 24px)}
#search:focus{border-color:#7c3aed}
#asset-list{overflow-y:auto;flex:1}
.company-label{padding:6px 14px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;color:#4b5563;text-transform:uppercase;position:sticky;top:0;background:#111827;border-bottom:1px solid #1f2937}
.asset-item{padding:8px 14px 8px 18px;cursor:pointer;font-size:12px;color:#9ca3af;border-left:3px solid transparent;transition:all .1s;display:flex;justify-content:space-between;align-items:center}
.asset-item:hover{background:#1f2937;color:#e2e8f0}
.asset-item.active{background:#1e1b4b;border-left-color:#7c3aed;color:#c4b5fd}
.asset-item .rc{display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-ok{background:#10b981}.dot-err{background:#ef4444}.dot-none{background:#374151}
.mesh-ct{font-size:10px;color:#4b5563}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#prog-wrap{height:3px;background:#1f2937;flex-shrink:0}
#prog-bar{height:100%;background:#7c3aed;width:0%;transition:width .15s}
#viewport{flex:1;position:relative;background:#050709;overflow:hidden}
#viewport canvas{display:block;width:100%!important;height:100%!important}

#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;transition:opacity .2s}
.spinner{width:28px;height:28px;border:3px solid #1f2937;border-top-color:#7c3aed;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ov-msg{font-size:13px;color:#7c3aed;font-weight:500}
#ov-sub{font-size:11px;color:#4b5563;text-align:center;max-width:300px;line-height:1.5}

#mode-row{position:absolute;top:10px;left:10px;display:flex;gap:5px;z-index:5}
.mbtn{padding:4px 11px;font-size:11px;border-radius:5px;cursor:pointer;border:1px solid #374151;background:#111827cc;color:#6b7280;backdrop-filter:blur(4px)}
.mbtn.on{background:#1e1b4bcc;border-color:#7c3aed;color:#c4b5fd}
#hint{position:absolute;bottom:8px;right:10px;font-size:10px;color:#1f2937;line-height:1.7;pointer-events:none;text-align:right}

#info-bar{background:#111827;border-top:1px solid #1f2937;padding:8px 16px;display:flex;align-items:center;gap:18px;flex-shrink:0;flex-wrap:wrap}
.chip span:first-child{font-size:9px;color:#4b5563;text-transform:uppercase;letter-spacing:.06em;display:block}
.chip span:last-child{font-size:12px;color:#e2e8f0}
#badge{margin-left:auto;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.bok{background:#064e3b;color:#34d399}.berr{background:#450a0a;color:#f87171}.bload{background:#1e1b4b;color:#a78bfa}.bidle{background:#1f2937;color:#6b7280}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Cyberwave Catalog</h1>
    <p id="asset-count">Loading…</p>
  </div>
  <input id="search" type="text" placeholder="Search…">
  <div id="asset-list"></div>
</div>

<div id="main">
  <div id="prog-wrap"><div id="prog-bar"></div></div>
  <div id="viewport">
    <div id="mode-row">
      <button class="mbtn on" id="btn-all">All meshes</button>
      <button class="mbtn" id="btn-urdf">URDF assembly</button>
    </div>
    <div id="overlay">
      <div class="spinner" id="spin" style="display:none"></div>
      <div id="ov-msg" style="color:#374151">← Select a robot</div>
      <div id="ov-sub"></div>
    </div>
    <div id="hint">Drag · Scroll to zoom<br>Right-drag to pan · Auto-rotates</div>
  </div>
  <div id="info-bar">
    <div class="chip"><span>Company</span><span id="i-co">—</span></div>
    <div class="chip"><span>Robot</span><span id="i-rb">—</span></div>
    <div class="chip"><span>Meshes</span><span id="i-mc">—</span></div>
    <div class="chip"><span>Mode</span><span id="i-mode">—</span></div>
    <div class="chip"><span>URDF</span><span id="i-urdf">—</span></div>
    <span id="badge" class="bidle">idle</span>
  </div>
</div>

// ── Materials ───────────────────────────────────────────────────────────────
const PALETTE = [
  0x6e9fd4, 0x72b89a, 0xd4a26c, 0xb07cc6, 0xc47a7a,
  0x7ab8d4, 0xaac67b, 0xd4c274, 0x7cd4c4, 0xd47baa,
  0x8899bb, 0x99bb88, 0xbb9988, 0x88bbbb, 0xbb88bb,
];
let palIdx = 0;
const makeMat = () => new THREE.MeshPhongMaterial({
  color: PALETTE[palIdx++ % PALETTE.length],
  specular: 0x222233, shininess: 28, side: THREE.DoubleSide
});

// ── Loaders ─────────────────────────────────────────────────────────────────
const stlL = new STLLoader();
const objL = new OBJLoader();
const daeL = new ColladaLoader();

function loadMeshURL(url) {
  const ext = url.split('?')[0].split('.').pop().toLowerCase();
  return new Promise((res, rej) => {
    if (ext === 'stl') {
      stlL.load(url, geo => {
        geo.computeVertexNormals();
        res(new THREE.Mesh(geo, makeMat()));
      }, undefined, rej);
    } else if (ext === 'obj') {
      objL.load(url, obj => {
        obj.traverse(c => { if (c.isMesh) c.material = makeMat(); });
        res(obj);
      }, undefined, rej);
    } else if (ext === 'dae') {
      daeL.load(url, col => {
        col.scene.traverse(c => { if (c.isMesh) c.castShadow = true; });
        res(col.scene);
      }, undefined, rej);
    } else {
      rej(new Error('unsupported: ' + ext));
    }
  });
}

// ── Utilities ────────────────────────────────────────────────────────────────
function parseVec3(s) {
  if (!s) return [0, 0, 0];
  return s.trim().split(/\s+/).map(Number);
}
function parseScale(s) {
  if (!s) return [1, 1, 1];
  const p = s.trim().split(/\s+/).map(Number);
  return p.length === 1 ? [p[0],p[0],p[0]] : p;
}

function setOverlay(show, msg = '', sub = '') {
  const ov = document.getElementById('overlay');
  ov.style.opacity = show ? '1' : '0';
  ov.style.pointerEvents = show ? 'auto' : 'none';
  document.getElementById('ov-msg').textContent = msg;
  document.getElementById('ov-sub').textContent = sub;
  document.getElementById('spin').style.display = (show && msg && msg !== '← Select a robot') ? 'block' : 'none';
}
function setProgress(f) {
  document.getElementById('prog-bar').style.width = (Math.min(f,1)*100) + '%';
}
function setBadge(cls, txt) {
  const b = document.getElementById('badge');
  b.className = cls; b.textContent = txt;
}
function clearScene() {
  if (currentRoot) { scene.remove(currentRoot); currentRoot = null; }
  palIdx = 0;
}
function fitCamera(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  if (maxDim === 0) return;
  // Move object to origin
  obj.position.sub(center);
  grid.position.y = -center.y + box.min.y - 0.5;
  const dist = maxDim * 1.6;
  camera.position.set(dist * 0.55, dist * 0.45, dist * 0.85);
  ctrl.target.set(0, 0, 0);
  ctrl.update();
  ctrl.autoRotate = true;
}

// ── Mode ─────────────────────────────────────────────────────────────────────
let mode = 'all';   // 'all' | 'urdf'
let activeIdx = -1;
const dotStatus = {};

// ── Load all meshes (no URDF, all overlaid at origin) ────────────────────────
//  SCALE: our meshes are in mm, so we apply 0.001 to convert to metres.
//         For meshes already in mm (go_bdx etc.) same rule applies.
const MM_SCALE = 0.001;

async function loadAllMeshes(asset) {
  clearScene();
  const paths = asset.allMeshes;
  setOverlay(true, `Loading ${paths.length} meshes…`, asset.company + ' / ' + asset.robot);
  setBadge('bload', 'loading…');
  setProgress(0);
  document.getElementById('i-mode').textContent = 'all meshes (overlaid)';

  const group = new THREE.Group();
  let done = 0, ok = 0, fail = 0;

  await Promise.all(paths.map(path =>
    loadMeshURL(path).then(m => {
      // Apply uniform mm→m scale to every mesh
      m.scale.set(MM_SCALE, MM_SCALE, MM_SCALE);
      group.add(m); ok++;
    }).catch(() => fail++)
    .finally(() => { done++; setProgress(done / paths.length); })
  ));

  if (group.children.length === 0) {
    setOverlay(true, '✗ No meshes loaded', 'Check console for errors');
    setBadge('berr', 'no geometry');
    dotStatus[asset.company+'/'+asset.robot] = 'err';
    return;
  }

  currentRoot = group;
  scene.add(group);
  fitCamera(group);
  setOverlay(false);
  const label = fail ? `⚠ ${ok} ok / ${fail} failed` : `✓ ${ok} meshes`;
  setBadge(fail ? 'berr' : 'bok', label);
  dotStatus[asset.company+'/'+asset.robot] = fail && ok===0 ? 'err' : 'ok';
  renderList(document.getElementById('search').value);
}

// ── URDF assembly (full kinematic tree at zero pose) ─────────────────────────
async function loadURDF(asset) {
  if (!asset.urdf) { return loadAllMeshes(asset); }

  clearScene();
  setOverlay(true, 'Parsing URDF…', asset.company + ' / ' + asset.robot);
  setBadge('bload', 'parsing…');
  setProgress(0);

  let text;
  try {
    const r = await fetch(asset.urdf);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    text = await r.text();
  } catch(e) {
    setOverlay(true, 'URDF fetch failed', e.message);
    setBadge('berr', 'fetch error');
    return;
  }

  const doc = new DOMParser().parseFromString(text, 'text/xml');

  // -- Gather all visual mesh entries
  const visuals = [];  // { linkName, filename, scale:[x,y,z], xyz:[x,y,z], rpy:[x,y,z] }
  doc.querySelectorAll('link').forEach(linkEl => {
    const linkName = linkEl.getAttribute('name');
    linkEl.querySelectorAll('visual').forEach(vis => {
      const meshEl = vis.querySelector('geometry mesh');
      if (!meshEl) return;
      const filename = (meshEl.getAttribute('filename') || '').trim();
      if (!filename) return;
      const sc  = parseScale(meshEl.getAttribute('scale'));
      const ori = vis.querySelector('origin');
      const xyz = parseVec3(ori?.getAttribute('xyz'));
      const rpy = parseVec3(ori?.getAttribute('rpy'));
      visuals.push({ linkName, filename, sc, xyz, rpy });
    });
  });

  // Unique mesh filenames referenced
  const uniqueFiles = new Set(visuals.map(v => v.filename));
  document.getElementById('i-mode').textContent =
    `URDF (${uniqueFiles.size} unique meshes)`;

  // If URDF is a stub (only 1 unique mesh file), it won't show the full robot.
  // Switch to all-meshes mode automatically.
  if (uniqueFiles.size <= 1) {
    setOverlay(true,
      `Stub URDF detected (1 mesh) — loading all ${asset.meshCount} meshes`,
      'Switching to all-meshes mode');
    await new Promise(r => setTimeout(r, 800));
    return loadAllMeshes(asset);
  }

  // -- Parse joints
  const jointOf = {};  // childLink → { parent, xyz, rpy }
  doc.querySelectorAll('joint').forEach(j => {
    const child  = j.querySelector('child')?.getAttribute('link');
    const parent = j.querySelector('parent')?.getAttribute('link');
    if (!child || !parent) return;
    const ori = j.querySelector('origin');
    jointOf[child] = { parent,
      xyz: parseVec3(ori?.getAttribute('xyz')),
      rpy: parseVec3(ori?.getAttribute('rpy')) };
  });

  // Find root link
  const allLinkNames = [...new Set([
    ...doc.querySelectorAll('link'), ].map(l => l.getAttribute('name')))
  ];
  const childSet = new Set(Object.keys(jointOf));
  const rootLink = allLinkNames.find(l => !childSet.has(l)) ?? allLinkNames[0];

  // Build Three.js group hierarchy
  const linkGroups = {};
  allLinkNames.forEach(n => { linkGroups[n] = new THREE.Group(); linkGroups[n].name = n; });

  const placed = new Set();
  function placeLink(name, parent) {
    if (placed.has(name)) return;
    placed.add(name);
    parent.add(linkGroups[name]);
    const j = jointOf[name];
    if (j) {
      linkGroups[name].position.set(...j.xyz);
      linkGroups[name].rotation.set(j.rpy[0], j.rpy[1], j.rpy[2], 'XYZ');
    }
    allLinkNames.forEach(l => { if (jointOf[l]?.parent === name) placeLink(l, linkGroups[name]); });
  }
  const rootGroup = new THREE.Group();
  placeLink(rootLink, rootGroup);
  allLinkNames.forEach(l => { if (!placed.has(l)) placeLink(l, rootGroup); });

  // Load meshes
  const total = visuals.length;
  setOverlay(true, `Assembling ${total} meshes…`, `${allLinkNames.length} links`);
  let done = 0, ok = 0, fail = 0;

  const baseURL = new URL(asset.urdf, location.href).href;

  await Promise.all(visuals.map(vis => {
    const url = new URL(vis.filename, baseURL).href;
    return loadMeshURL(url).then(m => {
      const w = new THREE.Group();
      w.position.set(...vis.xyz);
      w.rotation.set(vis.rpy[0], vis.rpy[1], vis.rpy[2], 'XYZ');
      w.scale.set(...vis.sc);
      w.add(m);
      linkGroups[vis.linkName].add(w);
      ok++;
    }).catch(e => { console.warn('mesh fail:', url, e); fail++; })
    .finally(() => { done++; setProgress(done / total); });
  }));

  if (ok === 0) {
    setOverlay(true, '✗ All meshes failed to load',
      'Check that URDF paths resolve correctly');
    setBadge('berr', 'no geometry');
    dotStatus[asset.company+'/'+asset.robot] = 'err';
    return;
  }

  currentRoot = rootGroup;
  scene.add(rootGroup);
  fitCamera(rootGroup);
  setOverlay(false);
  const lbl = fail ? `⚠ ${ok}/${total} (${fail} failed)` : `✓ ${ok} meshes assembled`;
  setBadge(fail ? 'berr' : 'bok', lbl);
  dotStatus[asset.company+'/'+asset.robot] = ok > 0 ? 'ok' : 'err';
  renderList(document.getElementById('search').value);
}

// ── Dispatch ─────────────────────────────────────────────────────────────────
function loadAsset(asset) {
  return mode === 'urdf' ? loadURDF(asset) : loadAllMeshes(asset);
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderList(filter = '') {
  const q = filter.toLowerCase();
  const filtered = q
    ? ASSETS.filter(a => (a.company + ' ' + a.robot).toLowerCase().includes(q))
    : ASSETS;
  document.getElementById('asset-count').textContent =
    `${filtered.length} / ${ASSETS.length} assets`;

  const byComp = {};
  filtered.forEach(a => {
    if (!byComp[a.company]) byComp[a.company] = [];
    byComp[a.company].push({ ...a, oi: ASSETS.indexOf(a) });
  });

  document.getElementById('asset-list').innerHTML =
    Object.entries(byComp).map(([co, bots]) => `
      <div class="company-label">${co}</div>
      ${bots.map(a => {
        const key = a.company + '/' + a.robot;
        const ds = dotStatus[key] ?? 'none';
        return `<div class="asset-item${a.oi === activeIdx ? ' active' : ''}" data-idx="${a.oi}">
          <span class="rc"><span class="dot dot-${ds}"></span>${a.robot}</span>
          <span class="mesh-ct">${a.meshCount}</span>
        </div>`;
      }).join('')}
    `).join('');

  document.querySelectorAll('.asset-item').forEach(el =>
    el.addEventListener('click', () => selectAsset(+el.dataset.idx)));
}

function selectAsset(idx) {
  activeIdx = idx;
  const a = ASSETS[idx];
  document.getElementById('i-co').textContent   = a.company;
  document.getElementById('i-rb').textContent   = a.robot;
  document.getElementById('i-mc').textContent   = a.meshCount;
  document.getElementById('i-urdf').textContent = a.urdf ? a.urdf.split('/').pop() : 'none';
  renderList(document.getElementById('search').value);
  loadAsset(a);
}

// Mode buttons
document.getElementById('btn-all').addEventListener('click', () => {
  mode = 'all';
  document.getElementById('btn-all').classList.add('on');
  document.getElementById('btn-urdf').classList.remove('on');
  if (activeIdx >= 0) loadAsset(ASSETS[activeIdx]);
});
document.getElementById('btn-urdf').addEventListener('click', () => {
  mode = 'urdf';
  document.getElementById('btn-urdf').classList.add('on');
  document.getElementById('btn-all').classList.remove('on');
  if (activeIdx >= 0) loadAsset(ASSETS[activeIdx]);
});

document.getElementById('search').addEventListener('input', e => renderList(e.target.value));

setOverlay(true, '← Select a robot', '');
renderList();
</script>
</body>
</html>
